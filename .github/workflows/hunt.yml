name: sussy-seed-hunt

on:
  workflow_dispatch:
    inputs:
      target_hits:
        description: "Stop after N hits (per shard)"
        required: false
        default: "2"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      TARGET_HITS: ${{ github.event.inputs.target_hits || '2' }}
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install scanner
        run: npm install @onimaxxing/sussy-seeds-mcp@0.3.1 --no-audit --no-fund

      - name: Hunt seeds
        run: node hunt.mjs

      - name: Results
        if: always()
        run: cat summary.md >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hits-shard-${{ matrix.shard }}
          path: |
            hits.json
            summary.md
          if-no-files-found: warn
